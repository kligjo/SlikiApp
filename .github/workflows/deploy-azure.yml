name: Build and deploy desklmphotos to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: desklmphotos-dev
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION_PATH: SlikiApp.slnx
  IMAGE_NAME: desklmphotos

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

  deploy_infrastructure:
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    outputs:
      container_app_name: ${{ steps.deploy.outputs.container_app_name }}
      container_app_url: ${{ steps.deploy.outputs.container_app_url }}
      acr_login_server: ${{ steps.deploy.outputs.acr_login_server }}
      acr_name: ${{ steps.deploy.outputs.acr_name }}

    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate pipeline configuration
        shell: bash
        run: |
          missing=0
          for name in AZURE_RESOURCE_GROUP AZURE_LOCATION; do
            if [ -z "${!name}" ]; then
              echo "::error::$name GitHub variable is required."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --output none

      - name: Deploy infrastructure
        id: deploy
        shell: bash
        run: |
          deployment_outputs=$(az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file ./infra/main.bicep \
            --parameters @./infra/main.parameters.json \
            --parameters location="$AZURE_LOCATION" \
            --parameters sqlAdminPassword="${{ secrets.AZURE_SQL_ADMIN_PASSWORD }}" \
            --query "properties.outputs" \
            --output json)

          container_app_name=$(python -c "import json,sys; print(json.load(sys.stdin)['containerAppName']['value'])" <<< "$deployment_outputs")
          container_app_url=$(python -c "import json,sys; print(json.load(sys.stdin)['containerAppUrl']['value'])" <<< "$deployment_outputs")
          acr_login_server=$(python -c "import json,sys; print(json.load(sys.stdin)['acrLoginServer']['value'])" <<< "$deployment_outputs")
          acr_name=$(python -c "import json,sys; print(json.load(sys.stdin)['acrName']['value'])" <<< "$deployment_outputs")

          echo "container_app_name=$container_app_name" >> "$GITHUB_OUTPUT"
          echo "container_app_url=$container_app_url" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$acr_login_server" >> "$GITHUB_OUTPUT"
          echo "acr_name=$acr_name" >> "$GITHUB_OUTPUT"

  build_and_push:
    runs-on: ubuntu-latest
    needs: deploy_infrastructure

    env:
      ACR_LOGIN_SERVER: ${{ needs.deploy_infrastructure.outputs.acr_login_server }}
      ACR_NAME: ${{ needs.deploy_infrastructure.outputs.acr_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build and push Docker image
        run: |
          docker build \
            --tag "$ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --tag "$ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:latest" \
            .
          docker push "$ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker push "$ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:latest"

  deploy_application:
    runs-on: ubuntu-latest
    needs:
      - deploy_infrastructure
      - build_and_push
    environment:
      name: dev
      url: ${{ needs.deploy_infrastructure.outputs.container_app_url }}

    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      CONTAINER_APP_NAME: ${{ needs.deploy_infrastructure.outputs.container_app_name }}
      ACR_LOGIN_SERVER: ${{ needs.deploy_infrastructure.outputs.acr_login_server }}

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy container image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$ACR_LOGIN_SERVER/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --output none
