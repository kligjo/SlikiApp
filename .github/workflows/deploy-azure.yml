name: Build and deploy desklmphotos to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: desklmphotos-dev
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  SOLUTION_PATH: SlikiApp.slnx
  IMAGE_NAME: desklmphotos

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish_path: ${{ steps.publish.outputs.publish_path }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Publish
        run: dotnet publish UmbracoCms.Web/UmbracoCms.Web.csproj --configuration Release --output ./publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: ./publish

  deploy_infrastructure:
    runs-on: ubuntu-latest
    needs: build
    environment: dev
    outputs:
      web_app_name: ${{ steps.deploy.outputs.web_app_name }}
      web_app_url: ${{ steps.deploy.outputs.web_app_url }}

    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate pipeline configuration
        shell: bash
        run: |
          missing=0
          for name in AZURE_RESOURCE_GROUP AZURE_LOCATION; do
            if [ -z "${!name}" ]; then
              echo "::error::$name GitHub variable is required."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure resource group exists
        run: |
          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --output none

      - name: Deploy infrastructure
        id: deploy
        shell: bash
        run: |
          deployment_outputs=$(az deployment group create \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file ./infra/main.bicep \
            --parameters @./infra/main.parameters.json \
            --parameters location="$AZURE_LOCATION" \
            --parameters sqlAdminPassword="${{ secrets.AZURE_SQL_ADMIN_PASSWORD }}" \
            --query "properties.outputs" \
            --output json)

          web_app_name=$(python -c "import json,sys; print(json.load(sys.stdin)['webAppName']['value'])" <<< "$deployment_outputs")
          web_app_url=$(python -c "import json,sys; print(json.load(sys.stdin)['webAppUrl']['value'])" <<< "$deployment_outputs")

          echo "web_app_name=$web_app_name" >> "$GITHUB_OUTPUT"
          echo "web_app_url=$web_app_url" >> "$GITHUB_OUTPUT"

  deploy_application:
    runs-on: ubuntu-latest
    needs:
      - deploy_infrastructure
      - build
    environment:
      name: dev
      url: ${{ needs.deploy_infrastructure.outputs.web_app_url }}

    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      WEB_APP_NAME: ${{ needs.deploy_infrastructure.outputs.web_app_name }}

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: app
          path: ./publish

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          package: ./publish
          
      - name: List publish output
        run: ls -la ./publish